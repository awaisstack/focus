<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a120e" />
      <stop offset="40%" stop-color="#111d17" />
      <stop offset="100%" stop-color="#080d0a" />
    </linearGradient>

    <linearGradient id="islandTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d4f3b" />
      <stop offset="60%" stop-color="#213a2b" />
      <stop offset="100%" stop-color="#172b20" />
    </linearGradient>

    <linearGradient id="islandEdge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a2e23" />
      <stop offset="100%" stop-color="#0e1a13" />
    </linearGradient>

    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#fcd34d" />
    </linearGradient>

    <radialGradient id="beaconGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.6" />
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="sunGlow" cx="20%" cy="10%" r="60%">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0a120e" stop-opacity="0" />
    </radialGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="630" fill="url(#bgGradient)" />
  <rect width="1200" height="630" fill="url(#sunGlow)" />

  <!-- Subtle Atmospheric Mist Curves -->
  <path d="M 0 380 Q 300 340 600 370 T 1200 350 L 1200 630 L 0 630 Z" fill="#13231a" opacity="0.4" />
  <path d="M 0 430 Q 350 400 700 440 T 1200 410 L 1200 630 L 0 630 Z" fill="#0c1711" opacity="0.6" />

  <!-- Stylized 2.5D Isometric Island Geometry (Center-Right) -->
  <g transform="translate(680, 310)">
    <!-- Base Rock Cliffs (Extrusion) -->
    <polygon points="0,90 320,10 400,50 400,120 80,200 0,160" fill="url(#islandEdge)" />
    <polygon points="-80,50 0,90 0,160 -80,120" fill="#0a130e" />
    <polygon points="80,200 400,120 320,180 60,240" fill="#080f0b" />

    <!-- Top Grass Terrace -->
    <polygon points="0,90 320,10 400,50 80,130" fill="url(#islandTop)" stroke="#3e6b50" stroke-width="2" />
    <polygon points="-80,50 0,90 80,130 0,90" fill="#294634" />
    <polygon points="80,130 400,50 320,180 60,240" fill="#1d3326" />

    <!-- Stepping Stone A* Path Network -->
    <g fill="#fbbf24" opacity="0.85" filter="url(#softGlow)">
      <circle cx="40" cy="98" r="5" />
      <circle cx="80" cy="85" r="5" />
      <circle cx="120" cy="74" r="5" />
      <circle cx="170" cy="65" r="5" />
      <circle cx="220" cy="58" r="5" />
      <circle cx="270" cy="50" r="5" />
      <circle cx="310" cy="45" r="6" />
    </g>

    <!-- Path Golden Connective Line -->
    <path d="M 40 98 Q 120 70 310 45" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="4,4" opacity="0.9" />

    <!-- Landmark 1: The Study Nook (Golden Beacon) -->
    <g transform="translate(40, 98)">
      <circle cx="0" cy="0" r="32" fill="url(#beaconGlow)" />
      <circle cx="0" cy="0" r="14" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.8" />
      <!-- Architectural Pagoda / Shrine Roof -->
      <polygon points="-12,-6 0,-18 12,-6 0,-2" fill="#d97706" />
      <polygon points="-8,-2 0,-10 8,-2 0,2" fill="#fbbf24" />
      <rect x="-3" y="2" width="6" height="12" fill="#78350f" />
      <circle cx="0" cy="-22" r="3" fill="#fef08a" filter="url(#softGlow)" />
      <!-- Blossom Accents -->
      <circle cx="-16" cy="4" r="3.5" fill="#f472b6" />
      <circle cx="14" cy="6" r="3" fill="#f472b6" />
    </g>

    <!-- Landmark 2: Writing Pavilion -->
    <g transform="translate(170, 65)">
      <polygon points="-10,-4 0,-14 10,-4 0,0" fill="#047857" />
      <rect x="-2" y="0" width="4" height="10" fill="#065f46" />
      <circle cx="0" cy="-16" r="2.5" fill="#a7f3d0" />
    </g>

    <!-- Landmark 3: Meadow Glade Observatory -->
    <g transform="translate(310, 45)">
      <polygon points="-14,-8 0,-20 14,-8 0,-3" fill="#0284c7" />
      <rect x="-3" y="-3" width="6" height="12" fill="#0369a1" />
      <circle cx="0" cy="-24" r="3.5" fill="#bae6fd" />
    </g>

    <!-- Botanical Scatter: Pine Trees & Grass Clumps -->
    <g fill="#14532d" opacity="0.9">
      <polygon points="100,50 106,30 112,50" />
      <polygon points="135,110 142,88 149,110" />
      <polygon points="250,90 256,72 262,90" />
      <polygon points="210,130 216,112 222,130" />
    </g>

    <!-- Fireflies / Golden Pollen -->
    <g fill="#fef08a" opacity="0.8" filter="url(#softGlow)">
      <circle cx="65" cy="65" r="2" />
      <circle cx="140" cy="50" r="1.5" />
      <circle cx="200" cy="80" r="2" />
      <circle cx="280" cy="30" r="2.5" />
      <circle cx="110" cy="120" r="1.8" />
    </g>
  </g>

  <!-- Left Content Column: Typography & Badges -->
  <g transform="translate(80, 80)">
    <!-- Hackathon Track Pill -->
    <g transform="translate(0, 0)">
      <rect width="470" height="32" rx="16" fill="#14261c" stroke="#2d523e" stroke-width="1.5" />
      <circle cx="18" cy="16" r="5" fill="#10b981" />
      <text x="32" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#a7f3d0" letter-spacing="1">
        AMD DEVELOPER HACKATHON: ACT III • CREATE A NEW KIND OF EXPERIENCE
      </text>
    </g>

    <!-- Main Title -->
    <text x="0" y="110" font-family="Georgia, Cambria, serif" font-size="64" font-weight="700" fill="#f8fafc" letter-spacing="-1">
      Focus Sanctuary
    </text>

    <!-- Value Proposition Tagline -->
    <text x="0" y="152" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="500" fill="#fbbf24">
      A Generative, Nature-Inspired 2.5D Productivity Sanctuary
    </text>

    <!-- Central Product Promise -->
    <g transform="translate(0, 185)">
      <rect width="520" height="88" rx="18" fill="#101c15" stroke="#1f382a" stroke-width="1.5" />
      <text x="24" y="34" font-family="Georgia, Cambria, serif" font-size="16" font-style="italic" fill="#e2e8f0">
        "Focus turns a changing day into a living world—
      </text>
      <text x="24" y="60" font-family="Georgia, Cambria, serif" font-size="16" font-style="italic" fill="#e2e8f0">
        and helps you find your next step when your plan changes."
      </text>
    </g>

    <!-- Feature Pillars Grid -->
    <g transform="translate(0, 305)">
      <!-- Pillar 1 -->
      <g transform="translate(0, 0)">
        <rect width="250" height="74" rx="14" fill="#0d1812" stroke="#1c3325" stroke-width="1" />
        <text x="16" y="26" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#fbbf24" letter-spacing="0.5">
          AMD TOKEN FACTORY
        </text>
        <text x="16" y="46" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#e2e8f0">
          Gemma-4-31B-IT Router
        </text>
        <text x="16" y="62" font-family="system-ui, sans-serif" font-size="10.5" fill="#94a3b8">
          $0.00034 / exp • Quota-protected
        </text>
      </g>

      <!-- Pillar 2 -->
      <g transform="translate(265, 0)">
        <rect width="255" height="74" rx="14" fill="#0d1812" stroke="#1c3325" stroke-width="1" />
        <text x="16" y="26" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#34d399" letter-spacing="0.5">
          DETERMINISTIC SCHEDULING
        </text>
        <text x="16" y="46" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#e2e8f0">
          "My Plans Changed" Engine
        </text>
        <text x="16" y="62" font-family="system-ui, sans-serif" font-size="10.5" fill="#94a3b8">
          45m window • Reversible undo
        </text>
      </g>

      <!-- Pillar 3 -->
      <g transform="translate(0, 86)">
        <rect width="250" height="74" rx="14" fill="#0d1812" stroke="#1c3325" stroke-width="1" />
        <text x="16" y="26" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="0.5">
          SEEDED PCG &amp; A* ROUTE
        </text>
        <text x="16" y="46" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#e2e8f0">
          JAHAN-Inspired World Model
        </text>
        <text x="16" y="62" font-family="system-ui, sans-serif" font-size="10.5" fill="#94a3b8">
          5 Archetypes • 3 Bloom Stages
        </text>
      </g>

      <!-- Pillar 4 -->
      <g transform="translate(265, 86)">
        <rect width="255" height="74" rx="14" fill="#0d1812" stroke="#1c3325" stroke-width="1" />
        <text x="16" y="26" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#c084fc" letter-spacing="0.5">
          PROCEDURAL WEB AUDIO
        </text>
        <text x="16" y="46" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#e2e8f0">
          Real-time Sound Synthesis
        </text>
        <text x="16" y="62" font-family="system-ui, sans-serif" font-size="10.5" fill="#94a3b8">
          0 external audio files • 4 Biomes
        </text>
      </g>
    </g>

    <!-- Footer Credentials & Status -->
    <g transform="translate(0, 485)">
      <text x="0" y="0" font-family="Consolas, monospace" font-size="11" fill="#64748b">
        Stack: Next.js 14 App Router • React 18 • Three.js / R3F • Web Audio API • IndexedDB v1
      </text>
      <text x="0" y="18" font-family="Consolas, monospace" font-size="11" fill="#64748b">
        LabLab.ai AMD Hackathon Act III • Verified Production Build • 27/27 Tests Passing
      </text>
    </g>
  </g>
</svg>
